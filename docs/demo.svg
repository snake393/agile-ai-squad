<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Agile AI Squad delivery loop demo">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0e8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb944"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#35d49a"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="#0e1730"/>
  <text x="40" y="46" font-family='"Segoe UI", Arial, sans-serif' font-size="26" font-weight="700" fill="#e8ecff">Agile AI Squad</text>
  <text x="40" y="74" font-family='"Segoe UI", Arial, sans-serif' font-size="14" fill="#9fb0e8">From a vague notion or a big idea to delivery — the loop sizes itself to the work</text>

  <!-- pipeline cards -->
  <g font-family='"Segoe UI", Arial, sans-serif'>
    <rect x="41" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#8b95ff" stroke-width="2"/>
    <text x="100" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Idea</text>

    <rect x="193" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#37d5d3" stroke-width="2"/>
    <text x="252" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Clarify</text>

    <rect x="345" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#6d7bff" stroke-width="2"/>
    <text x="404" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Plan</text>

    <rect x="497" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#ffb944" stroke-width="2"/>
    <text x="556" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Build</text>

    <rect x="649" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#35d49a" stroke-width="2"/>
    <text x="708" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Verify</text>

    <rect x="801" y="170" width="118" height="64" rx="12" fill="#16224a" stroke="#37d5d3" stroke-width="2"/>
    <text x="860" y="208" font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Deliver</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#9fb0e8" stroke-width="2" fill="none">
    <line x1="161" y1="202" x2="189" y2="202" marker-end="url(#arrowGrey)"/>
    <line x1="313" y1="202" x2="341" y2="202" marker-end="url(#arrowGrey)"/>
    <line x1="465" y1="202" x2="493" y2="202" marker-end="url(#arrowGrey)"/>
    <line x1="617" y1="202" x2="645" y2="202" marker-end="url(#arrowGrey)"/>
    <line x1="769" y1="202" x2="797" y2="202" marker-end="url(#arrowGrey)"/>
  </g>

  <!-- right-sized bypass: small change goes straight to Build -->
  <path d="M252 158 Q 470 96 548 164" stroke="#ffb944" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="400" y="118" font-family='"Segoe UI", Arial, sans-serif' font-size="13" fill="#ffb944" text-anchor="middle">small change — straight to Build</text>

  <!-- learn & adjust loop: Verify back to Plan -->
  <path d="M708 240 Q 690 300 520 300 Q 420 300 410 242" stroke="#35d49a" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="560" y="288" font-family='"Segoe UI", Arial, sans-serif' font-size="13" fill="#35d49a" text-anchor="middle">Learn &amp; adjust — back to Plan</text>

  <!-- decision context store -->
  <rect x="41" y="330" width="878" height="62" rx="12" fill="#1b2b63" stroke="#8b95ff" stroke-width="2"/>
  <text x="480" y="356" font-family='"Segoe UI", Arial, sans-serif' font-size="16" font-weight="600" fill="#e8ecff" text-anchor="middle">Decision Context Store</text>
  <text x="480" y="378" font-family='"Segoe UI", Arial, sans-serif' font-size="13" fill="#9fb0e8" text-anchor="middle">product · architecture · workflow decisions — durable context carried forward</text>

  <!-- connectors between pipeline and store -->
  <g stroke="#8b95ff" stroke-width="2" stroke-dasharray="4 5" fill="none">
    <line x1="252" y1="240" x2="252" y2="326" marker-end="url(#arrowViolet)"/>
    <line x1="404" y1="240" x2="404" y2="326" marker-end="url(#arrowViolet)"/>
    <line x1="556" y1="240" x2="556" y2="326" marker-end="url(#arrowViolet)"/>
    <line x1="708" y1="240" x2="708" y2="326" marker-end="url(#arrowViolet)"/>
  </g>

  <!-- agents chip row under store -->
  <g font-family='"Segoe UI", Arial, sans-serif' text-anchor="middle">
    <rect x="41"  y="404" width="168" height="34" rx="17" fill="none" stroke="#6d7bff" stroke-width="2"/>
    <text x="125" y="426" font-size="14" fill="#aeb9ff">Product agent</text>
    <rect x="225" y="404" width="186" height="34" rx="17" fill="none" stroke="#6d7bff" stroke-width="2"/>
    <text x="318" y="426" font-size="14" fill="#aeb9ff">Architect agent</text>
    <rect x="427" y="404" width="140" height="34" rx="17" fill="none" stroke="#6d7bff" stroke-width="2"/>
    <text x="497" y="426" font-size="14" fill="#aeb9ff">UX agent</text>
    <rect x="583" y="404" width="140" height="34" rx="17" fill="none" stroke="#6d7bff" stroke-width="2"/>
    <text x="653" y="426" font-size="14" fill="#aeb9ff">Dev agent</text>
    <rect x="739" y="404" width="140" height="34" rx="17" fill="none" stroke="#6d7bff" stroke-width="2"/>
    <text x="809" y="426" font-size="14" fill="#aeb9ff">Test agent</text>
  </g>

  <text x="40" y="450" font-family='"Segoe UI", Arial, sans-serif' font-size="11" fill="#5a6aa6">Start anywhere — use the full loop, or carry its briefs and specs into your existing delivery workflow</text>
</svg>
